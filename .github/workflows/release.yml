name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: tune-bridge

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            deb_arch: amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
            deb_arch: arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install ALSA dev (Linux native)
        if: runner.os == 'Linux' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (aarch64-linux)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build tune-bridge (native)
        if: "!matrix.cross"
        run: cargo build --release -p oaat-cli --target ${{ matrix.target }}

      - name: Build tune-bridge (cross)
        if: matrix.cross
        run: cross build --release -p oaat-cli --target ${{ matrix.target }}

      # ts-controller — серверный контроллер SoundVault (Unix-сокет → только Linux)
      - name: Build ts-controller (native)
        if: runner.os == 'Linux' && !matrix.cross
        run: cargo build --release -p ts-controller --target ${{ matrix.target }}

      - name: Build ts-controller (cross)
        if: matrix.cross
        run: cross build --release -p ts-controller --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          RELDIR="target/${{ matrix.target }}/release"
          EXE=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXE=".exe"; fi
          ARCHIVE="${BINARY_NAME}-${TAG}-${{ matrix.target }}.${{ matrix.archive }}"
          # Version-less alias: releases/latest/download/<STABLE> всегда указывает
          # на свежий релиз — install-скрипты пинят URL один раз и не ломаются.
          ARCHIVE_STABLE="${BINARY_NAME}-${{ matrix.target }}.${{ matrix.archive }}"
          BIN="$RELDIR/${BINARY_NAME}${EXE}"
          if [ ! -f "$BIN" ]; then
            echo "Binary not found at $BIN"; ls -la "$RELDIR" | head -20; exit 1
          fi
          strip "$BIN" 2>/dev/null || true
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp dist/windows/install.ps1 "$RELDIR/"
            # В Git Bash на windows-runner tar = msys GNU tar: нет ни --format zip,
            # ни переключения контейнера через -a. Нативный Compress-Archive надёжен.
            # ВАЖНО: перечислять файлы явно — RELDIR это target/<triple>/release,
            # wildcard <RELDIR>\* затянет все build-артефакты (deps/, .pdb, .d, ~450MB).
            powershell.exe -NoProfile -Command "Compress-Archive -Path '$(cygpath -w "$RELDIR/${BINARY_NAME}.exe")','$(cygpath -w "$RELDIR/install.ps1")' -DestinationPath '$(cygpath -w "$ARCHIVE")' -Force"
          else
            FILES="$BINARY_NAME"
            if [ "${{ runner.os }}" = "Linux" ] && [ -f "$RELDIR/ts-controller" ]; then
              strip "$RELDIR/ts-controller" 2>/dev/null || true
              FILES="$FILES ts-controller"
            fi
            if [ "${{ runner.os }}" = "macOS" ]; then
              cp dist/macos/install.sh dist/macos/com.oaat.endpoint.plist.template "$RELDIR/"
              chmod +x "$RELDIR/install.sh"
              FILES="$FILES install.sh com.oaat.endpoint.plist.template"
            fi
            tar czf "$ARCHIVE" -C "$RELDIR" $FILES
          fi
          cp "$ARCHIVE" "$ARCHIVE_STABLE"
          PACKAGES="$ARCHIVE"
          PACKAGES_STABLE="$ARCHIVE_STABLE"
          # .deb (Linux): tune-bridge + ts-controller + systemd-unit + конфиг-семпл
          if [ -n "${{ matrix.deb_arch }}" ]; then
            VER="${TAG#v}"
            DEB="${BINARY_NAME}_${VER}_${{ matrix.deb_arch }}.deb"
            DEB_STABLE="${BINARY_NAME}_latest_${{ matrix.deb_arch }}.deb"
            ROOT=deb-root
            mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/local/bin" "$ROOT/etc/systemd/system" "$ROOT/etc/oaat"
            cp "$RELDIR/tune-bridge" "$ROOT/usr/local/bin/"
            cp "$RELDIR/ts-controller" "$ROOT/usr/local/bin/"
            printf 'Package: tune-bridge\nVersion: %s\nArchitecture: %s\nMaintainer: Andrei Tochenyi <druner@gmail.com>\nSection: sound\nPriority: optional\nDescription: OAAT audio endpoint + ts-controller (SoundVault fork)\n' "$VER" "${{ matrix.deb_arch }}" > "$ROOT/DEBIAN/control"
            printf '[Unit]\nDescription=SoundVault OAAT Audio Endpoint\nAfter=network-online.target sound.target\nWants=network-online.target\n\n[Service]\nType=simple\nExecStart=/usr/local/bin/tune-bridge endpoint --config /etc/oaat/endpoint.toml\nRestart=always\nRestartSec=3\n\n[Install]\nWantedBy=multi-user.target\n' > "$ROOT/etc/systemd/system/oaat-endpoint.service"
            printf '[endpoint]\nname = "my-endpoint"\nport = 9740\n\n[web_ui]\nenabled = true\nport = 9741\nbind = "0.0.0.0"\n# control_token генерируется автоматически при первом запуске\n# (файл /etc/oaat/endpoint.toml.token) и подхватывается сервером\n# SoundVault через mDNS TXT — вручную задавать не нужно.\n' > "$ROOT/etc/oaat/endpoint.toml.sample"
            printf '#!/bin/sh\nset -e\nif [ -d /run/systemd/system ]; then\n  systemctl daemon-reload\n  if [ ! -f /etc/oaat/endpoint.toml ] && [ -f /etc/oaat/endpoint.toml.sample ]; then\n    cp /etc/oaat/endpoint.toml.sample /etc/oaat/endpoint.toml\n  fi\n  systemctl enable oaat-endpoint.service\n  systemctl restart oaat-endpoint.service || true\nfi\n' > "$ROOT/DEBIAN/postinst"
            printf '#!/bin/sh\nset -e\nif [ -d /run/systemd/system ]; then\n  systemctl stop oaat-endpoint.service || true\n  systemctl disable oaat-endpoint.service || true\nfi\n' > "$ROOT/DEBIAN/prerm"
            chmod 755 "$ROOT/DEBIAN/postinst" "$ROOT/DEBIAN/prerm"
            dpkg-deb --build "$ROOT" "$DEB"
            cp "$DEB" "$DEB_STABLE"
            PACKAGES="$PACKAGES $DEB"
            PACKAGES_STABLE="$PACKAGES_STABLE $DEB_STABLE"
          fi
          ls -lh $PACKAGES $PACKAGES_STABLE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            tune-bridge-*.tar.gz
            tune-bridge-*.zip
            tune-bridge_*.deb

  pi-image:
    name: Raspberry Pi image (arm64)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libguestfs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libguestfs-tools
          sudo chmod 0644 /boot/vmlinuz* /boot/initrd* 2>/dev/null || true

      - uses: actions/download-artifact@v4
        with:
          name: aarch64-unknown-linux-gnu
          path: deb

      - name: Build Pi image
        run: |
          DEB=$(ls deb/tune-bridge_*_arm64.deb | head -1) bash scripts/build-pi-image.sh soundvault-pi-arm64.img.xz

      - uses: actions/upload-artifact@v4
        with:
          name: pi-image
          path: |
            soundvault-pi-arm64.img.xz
            soundvault-pi-arm64.img.xz.sha256

  release:
    needs: [build, pi-image]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
